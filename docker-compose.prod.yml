# PSMS production composition.
#
# Brings up: postgres + api + web (nginx reverse-proxy). Secrets come
# from the host environment — this file does NOT bake any secrets, and
# every required variable is documented in .env.example.
#
# Operate with:
#   docker compose -f docker-compose.prod.yml --env-file /etc/psms/.env up -d
#
# Backups: see docs/runbooks/backup-recovery.md (PRF-10, RPO ≤ 24h).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - psms-pg-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Postgres is internal-only — never expose 5432 to the host in prod.
    networks:
      - psms-internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-psms_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      MAGIC_LINK_TTL_HOURS: ${MAGIC_LINK_TTL_HOURS:-24}
      MAGIC_LINK_MAX_ACTIVE_PER_SUPERVISOR: ${MAGIC_LINK_MAX_ACTIVE_PER_SUPERVISOR:-3}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_WEBHOOK_PUBLIC_KEY: ${SENDGRID_WEBHOOK_PUBLIC_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      CERT_SIGNING_KEY: ${CERT_SIGNING_KEY}
      CERT_PUBLIC_KEY: ${CERT_PUBLIC_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      ISIMS_CSV_PATH: ${ISIMS_CSV_PATH}
      ISIMS_IMPORT_CRON: ${ISIMS_IMPORT_CRON}
      RATE_LIMIT_SIGNIN_PER_IP_PER_5MIN: ${RATE_LIMIT_SIGNIN_PER_IP_PER_5MIN:-5}
      RATE_LIMIT_MAGICLINK_ISSUE_PER_HOUR: ${RATE_LIMIT_MAGICLINK_ISSUE_PER_HOUR:-20}
    volumes:
      # Read-only mount for the iSIMS nightly drop directory.
      - ${ISIMS_CSV_HOST_PATH}:${ISIMS_CSV_PATH}:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - psms-internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "${PSMS_WEB_PORT:-80}:80"
    networks:
      - psms-internal

volumes:
  psms-pg-prod:

networks:
  psms-internal:
    driver: bridge
